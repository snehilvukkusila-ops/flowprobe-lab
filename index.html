<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowProbe</title>
  </head>
  <body>
    <!--
      Restores the real path 404.html encoded into ?p=... (see public/404.html)
      via history.replaceState BEFORE react-router mounts, so a direct/
      deep-link navigation to any client-side route works on GitHub Pages.
    -->
    <script>
      (function (l) {
        if (l.search[1] === 'p') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded[0].slice(2) + (decoded[1] ? '?' + decoded[1].slice(2) : '') + l.hash
          )
        }
      })(window.location)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
