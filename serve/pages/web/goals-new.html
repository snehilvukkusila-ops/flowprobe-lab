<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create a goal · Probe Guide</title>
  </head>
  <body>
    <nav aria-label="Main">
      <a href="/probe-guide/goals">Goals</a>
      <a href="/probe-guide/reports">Reports</a>
    </nav>
    <main data-route="/goals/new">
      <p class="breadcrumb">Home / Goals / New</p>
      <h1>Create a goal</h1>
      <p>Name the goal, pick when it is due, and say who owns it.</p>
      <form name="new_goal" data-submit="client_only">
        <label for="new_goal-goal-title">Goal title</label>
        <input id="new_goal-goal-title" name="new_goal-goal-title" />
        <label for="new_goal-target-date">Target date</label>
        <input id="new_goal-target-date" name="new_goal-target-date" />
        <label for="new_goal-owner">Owner</label>
        <input id="new_goal-owner" name="new_goal-owner" />
        <label for="new_goal-priority">Priority</label>
        <input id="new_goal-priority" name="new_goal-priority" />
        <label for="new_goal-status">Status</label>
        <input id="new_goal-status" name="new_goal-status" />
        <label for="new_goal-notes">Notes</label>
        <input id="new_goal-notes" name="new_goal-notes" />
        <button type="submit">Save</button>
      </form>
    </main>
    <script>
      var CALLS = [{"m": "GET", "u": "/api/goals/owners"}];
      CALLS.forEach(function (c) {
        fetch(c.u, { method: c.m }).catch(function () {});
      });
    </script>
  </body>
</html>
