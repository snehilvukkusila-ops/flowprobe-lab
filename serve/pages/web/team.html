<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Team · Probe Pages</title>
  </head>
  <body>
    <nav aria-label="Main">
      <a href="/probe-pages/team">Team</a>
      <a href="/probe-pages/settings">Settings</a>
      <a href="/probe-pages/profile">Profile</a>
      <button type="button">Sign out</button>
    </nav>
    <main data-route="/team">
      <p class="breadcrumb">Home / Team</p>
      <h1>Team</h1>
      <p><span class="badge">Active</span><span class="badge">Away</span><span class="badge">Offline</span></p>
      <p>Everyone on your team, with their role and status.</p>
      <table>
        <thead><tr><th>Name</th><th>Role</th><th>Status</th></tr></thead>
        <tbody>
          <tr><th scope="row">Item 1</th><td>Role 1</td><td>Status 1</td></tr>
          <tr><th scope="row">Item 2</th><td>Role 2</td><td>Status 2</td></tr>
          <tr><th scope="row">Item 3</th><td>Role 3</td><td>Status 3</td></tr>
        </tbody>
      </table>
    <div class="controls">
      <a class="control" role="button" href="/probe-pages/invite">+ Invite</a>
    </div>
    </main>
  </body>
</html>
